<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="48" viewBox="0 0 32 48"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Pin -->
  <path d="
      M16 2
      C8 2 2 8 2 16
      C2 28 16 44 16 44
      C16 44 30 28 30 16
      C30 8 24 2 16 2
      Z"
      fill="#d73027"
      stroke="#8b0000"
      stroke-width="1.5"/>

  <!-- Beetle -->
  <g fill="white"
     stroke="white"
     stroke-width="1"
     stroke-linecap="round">

    <!-- Body -->
    <ellipse cx="16" cy="18" rx="3.5" ry="5"/>

    <!-- Head -->
    <circle cx="16" cy="12.5" r="1.8"/>

    <!-- Antennae -->
    <line x1="15.3" y1="11" x2="13" y2="8"/>
    <line x1="16.7" y1="11" x2="19" y2="8"/>

    <!-- Left legs -->
    <line x1="13" y1="16" x2="10" y2="14"/>
    <line x1="13" y1="19" x2="10" y2="20"/>
    <line x1="13" y1="22" x2="10" y2="25"/>

    <!-- Right legs -->
    <line x1="19" y1="16" x2="22" y2="14"/>
    <line x1="19" y1="19" x2="22" y2="20"/>
    <line x1="19" y1="22" x2="22" y2="25"/>

    <!-- Wing split -->
    <line x1="16" y1="14.5" x2="16" y2="23"/>

  </g>

</svg>